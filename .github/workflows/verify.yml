name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    name: ハーネス（Lint・hooks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint（共通＋業務固有）
        run: bash scripts/lint/run-all.sh
      - name: hooks の自己テスト
        run: bash .github/hooks/tests/test-guard.sh

  build:
    name: ビルドとテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify（単体テスト・ArchUnit）
        run: mvn -B verify
